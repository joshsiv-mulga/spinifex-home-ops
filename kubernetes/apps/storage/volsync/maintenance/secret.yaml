---
apiVersion: v1
kind: Secret
metadata:
  name: volsync-maintenance-secret
stringData:
  KOPIA_REPOSITORY: s3://${VOLSYNC_S3_BUCKET}
  KOPIA_PASSWORD: ${VOLSYNC_KOPIA_PASSWORD}
  AWS_ACCESS_KEY_ID: ${VOLSYNC_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${VOLSYNC_KEY_SECRET}
  AWS_S3_ENDPOINT: ${VOLSYNC_S3_ENDPOINT}
  AWS_REGION: ${SPINIFEX_REGION}
