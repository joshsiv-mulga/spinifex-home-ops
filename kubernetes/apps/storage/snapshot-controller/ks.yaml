---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: storage
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: snapshot-controller
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  interval: 30m
  path: ./kubernetes/apps/storage/snapshot-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  timeout: 5m
  # aws-ebs-csi-driver and volsync depend on this one for the VolumeSnapshot
  # CRDs, so Ready must mean the controller is actually running, not just
  # applied.
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
