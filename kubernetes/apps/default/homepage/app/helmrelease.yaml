---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      homepage:
        serviceAccount:
          identifier: homepage
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.3.0@sha256:f820276654539cdc2cf0169f28188d135919a7984fad76d83d8d5ff1383f3705
            env:
              TZ: Australia/Sydney
              HOMEPAGE_ALLOWED_HOSTS: &host "home.${SECRET_DOMAIN}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # homepage writes to /app/.next at runtime
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 15m
                memory: 200Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # The Kubernetes widget reads nodes and pods through the in-cluster API,
      # which needs the service account token on disk. The chart leaves it off
      # by default, so naming a service account alone is not enough.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        ports:
          http:
            port: &port 3000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - *host
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml
      # /app/config comes from the image owned by root, and on startup the
      # server copies a whole skeleton of required files into it — custom.css,
      # proxmox.yaml and more — aborting on the first one it cannot write.
      # Backing the directory with an emptyDir is what makes that succeed; the
      # ConfigMap files above mount on top of it and win.
      config-dir:
        type: emptyDir
        globalMounts:
          - path: /app/config
    serviceAccount:
      homepage: {}
