---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: jellyfin
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: aws-ebs-csi-driver
      namespace: kube-system
    - name: snapshot-controller
      namespace: storage
    - name: volsync
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/default/jellyfin/app
  postBuild:
    substitute:
      APP: jellyfin
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_UID: "3000"
      VOLSYNC_GID: "0"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: false
