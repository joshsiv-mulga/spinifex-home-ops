---
apiVersion: v1
kind: Secret
metadata:
  name: atuin-secret
stringData:
  # The managed endpoint stands where the in-cluster Postgres service name
  # stood upstream. Nothing else about the application changes.
  ATUIN_DB_URI: postgres://atuin:${ATUIN_DB_PASSWORD}@${RDS_ENDPOINT}/atuin
  INIT_POSTGRES_HOST: ${RDS_ENDPOINT}
  INIT_POSTGRES_DBNAME: atuin
  INIT_POSTGRES_USER: atuin
  INIT_POSTGRES_PASS: ${ATUIN_DB_PASSWORD}
  # The engine reserves "postgres" as a master username, so the superuser is
  # named and the init container is pointed at it rather than its own default.
  INIT_POSTGRES_SUPER_USER: ${RDS_MASTER_USERNAME}
  INIT_POSTGRES_SUPER_PASS: ${RDS_MASTER_PASSWORD}
  # psql defaults to a database named after the connecting user, which the
  # master user does not have. The maintenance database is what it needs.
  PGDATABASE: postgres
