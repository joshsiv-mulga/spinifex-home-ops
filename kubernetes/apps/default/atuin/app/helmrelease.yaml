---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      atuin:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # A managed database hands out a master user that is not a superuser,
          # so it cannot create a database owned by a role it is not a member
          # of. Runs first, by name, and leaves the bootstrap below untouched.
          db-role:
            image: &initImage
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: atuin-secret
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                export PGHOST="$${INIT_POSTGRES_HOST}"
                export PGUSER="$${INIT_POSTGRES_SUPER_USER}"
                export PGPASSWORD="$${INIT_POSTGRES_SUPER_PASS}"
                export PGDATABASE=postgres
                until pg_isready -q; do
                    echo "Waiting for host '$${PGHOST}' ..."
                    sleep 1
                done
                psql -v ON_ERROR_STOP=1 \
                     -v role="$${INIT_POSTGRES_USER}" \
                     -v master="$${INIT_POSTGRES_SUPER_USER}" <<'SQL'
                SELECT format('CREATE ROLE %I LOGIN', :'role')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role')
                \gexec
                GRANT :"role" TO :"master";
                SQL
          init-db:
            image: *initImage
            envFrom: *envFrom
        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.22.0@sha256:1e94eb5c2fb6bb1e46da2591648efa11aa9507fcd80ddf812e4acbfe51d8a840
            env:
              ATUIN_HOST: 0.0.0.0
              ATUIN_PORT: &port 80
              ATUIN_OPEN_REGISTRATION: "true"
              ATUIN_METRICS__ENABLE: "true"
              ATUIN_METRICS__HOST: 0.0.0.0
              ATUIN_METRICS__PORT: &metricsPort 8080
              ATUIN_TLS__ENABLE: "false"
              TZ: Australia/Sydney
            envFrom: *envFrom
            # The image's entrypoint is already atuin-server.
            args:
              - start
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
    # Every durable thing this application owns lives in the database, so it
    # holds no claim of its own and a rebuild costs it nothing.
    persistence:
      config:
        type: emptyDir
    route:
      app:
        hostnames:
          - atuin.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        serviceName: atuin
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
