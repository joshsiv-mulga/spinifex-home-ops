---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: atuin
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: prometheus-operator-crds
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/default/atuin/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: false
