---
# The lab this came from routed alerts to Pushover, a Home Assistant webhook
# and an external heartbeat service. Those are the owner's own accounts and are
# deliberately not ported, so alerts are grouped and inhibited here and read in
# the Alertmanager UI rather than sent anywhere.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ["alertname", "job"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # The Watchdog alert fires constantly by design, as proof the pipeline is
      # alive. Upstream sends it to a heartbeat service; here it is grouped
      # tightly so it is visible without drowning anything else.
      - receiver: "null"
        groupInterval: 5m
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
