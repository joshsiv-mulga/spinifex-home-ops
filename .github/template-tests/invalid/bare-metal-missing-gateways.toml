# Negative fixture: bare-metal without the internal and dns gateway addresses.
# They are optional in the schema because a provider forwards the same traffic
# to a node port, so bare-metal has to be rejected by the Config cross-check.
[network]
node_cidr = "10.10.10.0/24"

[kubernetes.api]
addr = "10.10.10.254"

[domain]
name = "example.com"

[dns]
provider = "none"

[repository]
url = "https://github.com/onedr0p/cluster-template.git"

[[nodes]]
name         = "k8s-0"
address      = "10.10.10.100"
controller   = true
disk         = "/dev/sdfake"
mac_addr     = "00:00:00:00:00:00"
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
